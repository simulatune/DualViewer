name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            artifact: DualViewer-linux-x64
            exe_name: DualViewer
          - os: windows-latest
            platform: windows
            artifact: DualViewer-windows-x64
            exe_name: DualViewer.exe

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system libraries (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-keysyms1 libxcb-image0 libxcb-shape0 libxcb-xkb1 \
            libxcb-render-util0 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-cursor0 libxcb-util1 libpulse0 \
            libegl1 libgl1-mesa-glx

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download FFmpeg (Linux)
        if: matrix.platform == 'linux'
        run: |
          curl -L -o ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar xf ffmpeg.tar.xz
          cp ffmpeg-*-amd64-static/ffmpeg resources/ffmpeg
          cp ffmpeg-*-amd64-static/ffprobe resources/ffprobe
          chmod +x resources/ffmpeg resources/ffprobe

      - name: Download FFmpeg (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_extracted
          $dir = Get-ChildItem ffmpeg_extracted -Directory | Select-Object -First 1
          Copy-Item "$($dir.FullName)\bin\ffmpeg.exe" resources\ffmpeg.exe
          Copy-Item "$($dir.FullName)\bin\ffprobe.exe" resources\ffprobe.exe

      - name: Build with PyInstaller
        run: python -m PyInstaller --clean --noconfirm dualviewer.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.exe_name }}
          retention-days: 30

  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
